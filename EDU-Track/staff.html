<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff dashboard | EDU-Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/idcard.css">
  <link rel="stylesheet" href="css/camera.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-role="staff">
  <div class="bg-decor" aria-hidden="true"><span class="o1"></span><span class="o2"></span><span class="o3"></span></div>

  <header class="topbar glass">
    <a class="brand" href="index.html" aria-label="EDU-Track home">
      <span class="brand-mark" data-icon="cap"></span>
      <span><b>EDU-Track</b><small>MPSPS College</small></span>
    </a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    <div class="user-chip">
      <div class="who"><b id="chipName"></b><small id="chipRole"></small></div>
      <span class="avatar" id="chipAvatar"></span>
      <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn"><span data-icon="logout"></span>Log out</button>
    </div>
  </header>

  <main class="container" id="main"></main>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/localserver.js"></script>
  <script src="js/api.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/idcard.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
